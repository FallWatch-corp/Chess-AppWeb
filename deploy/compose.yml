services:
  server:
    image: ghcr.io/${COMPTE}/chess-appweb-server:${TAG}
    ports:
      - "3000:3000"
    volumes:
      - donnees_sqlite:/data
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      URL_API: ${URL_API}
      URL_CLIENT: ${URL_CLIENT}

  client:
    image: ghcr.io/${COMPTE}/chess-appweb-client:${TAG}
    ports:
      - "5173:3000"
    environment:
      # API_URL : adresse de l'API pour le serveur React, à l'intérieur du réseau Docker
      API_URL: http://server:3000
      # URL_API : adresse de l'API vue par le navigateur (connexion GitHub, Socket.IO)
      URL_API: ${URL_API}
    depends_on:
      - server

volumes:
  donnees_sqlite: