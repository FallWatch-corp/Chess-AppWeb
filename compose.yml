services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - donnees_sqlite:/data

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:3000"
    depends_on:
      - server

volumes:
  donnees_sqlite:
